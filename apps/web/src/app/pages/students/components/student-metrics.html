<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4" id="student-metrics-grid">
  <ui-stat-card id="metric-total-students" label="إجمالي الطلاب بالسجل" [value]="totalCount()" icon="groups" tone="primary" />
  <ui-stat-card id="metric-active-students" label="طلاب نشطون حاليًا" [value]="activeCount()" icon="verified_user" tone="success" />
  <ui-stat-card id="metric-filtered-students" label="نتائج التصفية الحالية" [value]="filteredCount()" icon="filter_alt" tone="primary" />
  <ui-stat-card id="metric-students-guardians" label="سجلات بأوصياء مسجلين" [value]="guardiansCount()" icon="family_restroom" tone="warning" />
</div>
