<ui-page-header
  title="إدارة الطلاب والسجلات"
  description="عرض وحفظ وإدارة كافة بيانات وقبول سجل الطلاب وشعبهم المعتمدة."
  eyebrow="إدارة المدرسة"
>
  <div ui-page-actions class="flex flex-wrap items-center gap-2">
    <ui-button size="sm" variant="secondary" title="تصدير الطلاب" ariaLabel="تصدير الطلاب" (activated)="exportStudents.emit()">
      <mat-icon aria-hidden="true">download</mat-icon>
      <span class="hidden sm:inline">تصدير الطلاب</span>
    </ui-button>
    <ui-button size="sm" variant="ghost" title="تصدير قالب البيانات" ariaLabel="تصدير قالب البيانات" (activated)="exportTemplate.emit()">
      <mat-icon aria-hidden="true">download</mat-icon>
      <span class="hidden sm:inline">تصدير القالب</span>
    </ui-button>
    <ui-button size="sm" variant="ghost" title="استيراد من إكسل" ariaLabel="استيراد من إكسل" (activated)="fileInput.click()">
      <mat-icon aria-hidden="true">upload</mat-icon>
      <span class="hidden sm:inline">استيراد</span>
    </ui-button>
    @if (canCreate) {
      <ui-button size="sm" variant="primary" title="إضافة طالب جديد" ariaLabel="إضافة طالب جديد" (activated)="addStudent.emit()">
        <mat-icon aria-hidden="true">person_add</mat-icon>
        <span>إضافة طالب</span>
      </ui-button>
    }
    <input type="file" #fileInput class="hidden" accept=".xlsx, .xls, .csv" (change)="onFileChange($event)" id="excel-file-input" />
  </div>
</ui-page-header>
