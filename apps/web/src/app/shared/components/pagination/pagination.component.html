<nav class="pagination" aria-label="ترقيم الصفحات" dir="rtl">
  <div class="pagination-summary">
    عرض {{ rangeStart() }}–{{ rangeEnd() }} من أصل {{ totalItems() }}
  </div>

  <div class="pagination-controls">
    <label class="page-size">
      <span>لكل صفحة</span>
      <select [value]="pageSize()" [disabled]="disabled()" (change)="onPageSizeChange($event)" aria-label="عدد العناصر في الصفحة">
        @for (size of pageSizeOptions(); track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </label>

    <button type="button" class="page-button" [disabled]="disabled() || page() === 1" (click)="goToPage(page() - 1)" aria-label="الصفحة السابقة">
      <mat-icon>chevron_right</mat-icon>
    </button>
    @for (pageNumber of pages(); track pageNumber) {
      <button type="button" class="page-button page-number" [class.active]="pageNumber === page()" [attr.aria-current]="pageNumber === page() ? 'page' : null" [disabled]="disabled()" (click)="goToPage(pageNumber)">{{ pageNumber }}</button>
    }
    <button type="button" class="page-button" [disabled]="disabled() || page() === totalPages()" (click)="goToPage(page() + 1)" aria-label="الصفحة التالية">
      <mat-icon>chevron_left</mat-icon>
    </button>
  </div>
</nav>
