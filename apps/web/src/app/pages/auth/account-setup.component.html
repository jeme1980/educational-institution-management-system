<main dir="rtl" class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
  <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-bold text-slate-900">إعداد حساب المستخدم</h1>
    <p class="mt-2 text-sm text-slate-500">أنشئ كلمة المرور الخاصة بك لإكمال إعداد الحساب وتسجيل الدخول.</p>
    @if (error()) { <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">{{ error() }}</div> }
    @if (success()) { <div class="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-700">{{ success() }}</div> }
    <form class="mt-6 space-y-4" (ngSubmit)="submit()">
      <label class="block text-sm font-semibold text-slate-700">كلمة المرور<input name="password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5" autocomplete="new-password" required></label>
      <label class="block text-sm font-semibold text-slate-700">تأكيد كلمة المرور<input name="confirmPassword" type="password" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5" autocomplete="new-password" required></label>
      <p class="text-xs text-slate-500">٨ أحرف على الأقل، مع حرف كبير وحرف صغير ورقم.</p>
      <ui-button class="w-full" type="submit" size="lg" [loading]="loading()" [disabled]="!token">حفظ كلمة المرور</ui-button>
    </form>
  </section>
</main>
